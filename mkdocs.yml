site_name: Virtual Serial Studio
site_description: A tool for real, virtual and networked serial ports
repo_url: https://github.com/iainchesworthlabs/virtual-serial-studio
site_url: https://virtual-serial-studio.com/docs/
docs_dir: docs
# Not the default "site": that name is too close to website/, the product site.
site_dir: build/docs
strict: true
theme:
  name: material
  # The system font: the published site loads nothing from another host.
  font: false
  features:
    - navigation.sections
    - content.code.copy
# The design bundle (specifications, tokens and HTML mockups) is reference
# material for the people building the GUI, not part of the site.
exclude_docs: |
  gui-design/
nav:
  - Home: index.md
  - Using the studio:
      - User guide: user-guide.md
      - Scenarios: scenarios.md
      - Interface design: ux.md
  - Building and testing:
      - Building: building.md
      - Testing: testing.md
      - Fuzzing: fuzzing.md
      - Continuous integration: ci.md
      - Profiling: profiling.md
      - Releasing: releasing.md
      - Languages: i18n.md
      - Application icon: app-icon.md
      - Contributing: contributing.md
      - Editions and licensing (proposal): editions.md
      - Licensing (design): licensing.md
  - How it works:
      - Architecture: architecture.md
      - The per-user agent: agent.md
      - Remote control and monitoring (proposal): remote-control.md
      - The plugin framework (design): plugins.md
      - Response timing rules (design): response-timing.md
      - POSIX virtual ports: posix-virtual-ports.md
      - Windows COM port driver: windows-com-driver.md
      - Platforms: platforms.md
      - Virtual machine testing: vm-testing.md
      - Workstreams: workstreams.md
      - Migration: migration.md
