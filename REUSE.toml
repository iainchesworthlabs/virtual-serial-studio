version = 1

# Files without a copyright line take the one below; files that carry their own keep it.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "Iain Chesworth Labs contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The overlay port is the vcpkg port of Tracy, which vcpkg publishes under the MIT licence,
# with two features added.
[[annotations]]
path = "cmake/vcpkg-ports/tracy/**"
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation and vcpkg contributors"
SPDX-License-Identifier = "MIT"

# The bundled fonts and their licence texts (apps/vss_gui/assets/fonts/README.md says where each comes from).
[[annotations]]
path = "apps/vss_gui/assets/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "The Noto Project Authors; IBM Corp."
SPDX-License-Identifier = "OFL-1.1"
