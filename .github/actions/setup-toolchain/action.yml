# SPDX-License-Identifier: GPL-3.0-or-later
name: Set up the toolchain
description: >
  Install the compiler, CMake and (optionally) Qt at the versions pinned in
  .github/toolchain-versions.json. Run it after the checkout.

inputs:
  compiler:
    description: gcc, clang, msvc or none (the runner's own compiler, as on macOS).
    default: none
  qt:
    description: true to install the pinned Qt kit.
    default: "false"
  nsis:
    description: >
      true to install NSIS (makensis) at the `nsis` pin, for the Windows installer. Windows runners only; the
      release workflow is the only caller.
    default: "false"
  gcc-version:
    description: GCC major version. Empty uses the `gcc` pin; the nightly newest-compiler leg passes `gcc_newest`.
    default: ""
  llvm-version:
    description: LLVM major version. Empty uses the `llvm` pin; the nightly newest-compiler leg passes `llvm_newest`.
    default: ""
  ccache:
    description: >
      The ccache lineage for this job (for example linux-gcc-release). Empty leaves ccache off. The
      job saves the cache with the save-ccache action, which does so only from develop.
    default: ""

runs:
  using: composite
  steps:
    - name: Set up GCC
      if: inputs.compiler == 'gcc' || inputs.compiler == 'clang'
      uses: iainchesworthlabs/icl-common-infra/actions/setup-gcc@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
      with:
        version: ${{ inputs.gcc-version }}
        export-compiler: ${{ inputs.compiler == 'gcc' && 'true' || 'false' }}

    - name: Set up Clang
      if: inputs.compiler == 'clang'
      uses: iainchesworthlabs/icl-common-infra/actions/setup-llvm@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
      with:
        version: ${{ inputs.llvm-version }}

    - name: Set up MSVC
      if: inputs.compiler == 'msvc'
      uses: iainchesworthlabs/icl-common-infra/actions/setup-msvc-env@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

    - name: Set up CMake
      uses: iainchesworthlabs/icl-common-infra/actions/setup-cmake@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

    - name: Set up Qt
      if: inputs.qt == 'true'
      uses: iainchesworthlabs/icl-common-infra/actions/setup-qt@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
      with:
        # The GUI draws its canvas with Qt Canvas Painter, an add-on module
        # (apps/vss_gui/src/rendering).
        modules: qtcanvaspainter

    # makensis builds the Windows installer (cmake/packaging/VssPackage-windows.cmake). Chocolatey is on the hosted Windows
    # runners; the version comes from the pin and the installed copy is checked against it. PATH is not changed: CPack
    # finds makensis through the registry entry the installer writes.
    - name: Set up NSIS
      if: inputs.nsis == 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $pins = Get-Content -Raw -LiteralPath "$env:GITHUB_WORKSPACE/.github/toolchain-versions.json" | ConvertFrom-Json
        $version = $pins.nsis
        if (-not $version) { throw 'nsis is not pinned in .github/toolchain-versions.json.' }
        choco install nsis --version $version --yes --no-progress --limit-output
        if ($LASTEXITCODE -ne 0) { throw "choco install nsis $version failed ($LASTEXITCODE)." }
        $dir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
        if (-not (Test-Path -LiteralPath (Join-Path $dir 'makensis.exe'))) { throw "makensis.exe is not in $dir." }
        $reported = (& (Join-Path $dir 'makensis.exe') /VERSION).Trim()
        Write-Host "makensis $reported"
        # The Chocolatey package is 3.12.0 and makensis calls the same release v3.12.
        $expected = 'v' + ($version -replace '\.0$', '')
        if ($reported -ne $expected) { throw "makensis reports $reported, but the pin is $version." }

    - name: Set up ccache
      if: inputs.ccache != ''
      uses: iainchesworthlabs/icl-common-infra/actions/setup-ccache@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
      with:
        key: ${{ inputs.ccache }}
