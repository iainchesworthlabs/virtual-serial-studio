name: Docs

# Builds the documentation site and puts it where readers find it (docs/ci.md, "Documentation site" and "Publishing").
#
# The site is the /virtual-serial-studio/ section of https://iainchesworthlabs.com, served from the company stack
# (the iainchesworthlabs/icl-site repository). A pull request that changes the documentation builds the site strictly,
# checks it, and, when the pull request comes from this repository, deploys a preview at
# https://iainchesworthlabs.com/_preview/virtual-serial-studio/pr-<n>/ and comments the address. The preview is
# removed when the pull request closes. A push to develop builds and checks, so that the branch has a status of its own
# (the badge in the README shows it). A push to the branch `site` deploys the live site. The release workflow moves
# `site` after it has published a release or a release candidate and attached the update feed, so the live site
# describes the latest published release (docs/releasing.md, "The site"). Only that push asks GitHub for the newest release
# and its update feed before it builds, so the Downloads page and updates/v1/feed.json are the release's; every other run builds
# from the release data in tools/docs/release/ (docs/ci.md, "Release data and the update feed").
#
# The deploy is the shared reusable workflow docs-deploy-aws.yml of icl-common-infra. It signs in to AWS with GitHub's
# OIDC token, with a role that the company stack trusts for a push to `site` and for a pull request of this repository
# only, and that can write only this site's prefix. A run without the four secrets skips the deploy with a warning.
# A run by hand cannot deploy, because the role trusts only a push (nor can the preview of a pull request from a fork).

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements/docs.in"
      - "requirements/docs.txt"
      - "CMakeLists.txt"
      - "tools/docs/**"
      - "tools/ci/site_*.py"
      - "tools/ci/check_site_*.py"
      - "tools/ci/check_release_data.py"
      - "tools/ci/check_claims.py"
      - "tools/ci/test_check_claims.py"
      - "tools/ci/test_site_*.py"
      - ".github/actions/docs-site/**"
      - "README.md"
      - "CMakePresets.json"
      - "tools/check_docs.py"
      - "tools/update_feed.py"
      - "tools/plugin_sign.py"
      - "libs/vss_update/src/trusted_keys_release.cpp"
      - "apps/vss_gui/assets/icon/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [develop, site]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  check:
    name: Check the docs against the repository
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the presets and badges
        run: |
          python3 -m unittest discover -s tools -p "test_check_docs.py"
          python3 tools/check_docs.py

  # The strict build and the checks of the site (docs/ci.md, "Documentation site"), the same action as the
  # `Docs build (strict)` job of ci.yml. The built site is kept as an artifact for the deploy jobs.
  build:
    name: Build site
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release data and the update feed come from GitHub only for the live site, so that a pull request is built from what it holds
      # (tools/docs/release/, docs/ci.md, "Release data and the update feed"). The token is the job's own, with the job's contents: read.
      - name: Refresh the release data and the update feed
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/site' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/docs/refresh_release.py
      - uses: ./.github/actions/docs-site
      - name: Keep the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: build/docs
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy the site
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/site' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy-aws.yml@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
    with:
      prefix: virtual-serial-studio
      production-ref: refs/heads/site
      # The company stack is in us-east-1; the shared workflow's default is ap-southeast-2.
      region: us-east-1
    secrets:
      DOCS_ROLE_ARN: ${{ secrets.DOCS_ROLE_ARN }}
      DOCS_PREVIEW_ROLE_ARN: ${{ secrets.DOCS_PREVIEW_ROLE_ARN }}
      DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
      DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}

  # A failed deploy is nearly always the role or its trust policy, which the owner sets up outside this repository.
  deploy-failed:
    name: Say why the deploy failed
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Explain
        run: |
          {
            echo "## The site was not deployed"
            echo
            echo "The deploy signs in with the role in the secret DOCS_ROLE_ARN. That role exists only after the company"
            echo "site's stack has been deployed with an entry for this repository: slug virtual-serial-studio, publish"
            echo "branch site (infra/lib/apps.ts in iainchesworthlabs/icl-site, then npx cdk deploy). This repository's"
            echo "OIDC subject claim must also have been customised (docs/ci.md, \"Publishing\"). Check both, then re-run"
            echo "this workflow run: a re-run of a push run is still a push, so the role accepts it."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::The site was not deployed. See the run summary; the role or its trust policy is the usual cause."

  preview:
    name: Deploy a preview
    needs: build
    if: >-
      ${{ github.event_name == 'pull_request' && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy-aws.yml@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
    with:
      prefix: virtual-serial-studio
      preview: true
      pr-number: ${{ github.event.pull_request.number }}
      region: us-east-1
    secrets:
      DOCS_ROLE_ARN: ${{ secrets.DOCS_ROLE_ARN }}
      DOCS_PREVIEW_ROLE_ARN: ${{ secrets.DOCS_PREVIEW_ROLE_ARN }}
      DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
      DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}

  remove-preview:
    name: Remove a preview
    if: >-
      ${{ github.event_name == 'pull_request' && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy-aws.yml@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
    with:
      mode: remove-preview
      prefix: virtual-serial-studio
      pr-number: ${{ github.event.pull_request.number }}
      region: us-east-1
    secrets:
      DOCS_ROLE_ARN: ${{ secrets.DOCS_ROLE_ARN }}
      DOCS_PREVIEW_ROLE_ARN: ${{ secrets.DOCS_PREVIEW_ROLE_ARN }}
      DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
      DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}
