# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

# A tag v* pushed from develop builds the packages for each platform, signs the
# Windows ones as the SIGN_WINDOWS repository variable says, and hands them to the
# shared publish workflow, which checks the tag, signs, attests and publishes
# (docs/releasing.md); a last job signs the update feed when the owner has set up the
# feed keys. Without a tag the same packages are built and kept as workflow
# artifacts and nothing is published: by hand (`gh workflow run release.yml`), every
# Monday so the install rules cannot rot unseen, and on a pull request that changes
# this workflow.

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/release.yml"
      - "tools/check_release_version.py"
      - "drivers/windows/**"
      - "cmake/VssPackage.cmake"
      - "cmake/packaging/**"
      - "packaging/**"
      - "tools/ci/check_linux_packages.sh"
      - "tools/ci/check_package_contents.py"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Check the version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with the project version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/check_release_version.py "$TAG"
      - name: Work out the version
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Check the release has notes
        uses: iainchesworthlabs/icl-common-infra/actions/release-notes@ac3ee29b71f27ff63b1e0db61cb335764ed56940 # v0.1.23
        with:
          version: ${{ steps.tag.outputs.version }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          output-file: ${{ runner.temp }}/notes.md

  package:
    name: Package (${{ matrix.name }})
    needs: version
    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, runner: ubuntu-26.04, preset: linux-release-gui, compiler: gcc}
          - {name: macos-arm64, runner: macos-26, preset: macos-release-gui, compiler: none}
          - {name: windows-x86_64, runner: windows-2025, preset: windows-msvc-release-gui, compiler: msvc}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version in the package says how many commits it is after the last release tag
          # (cmake/VssBuildStamp.cmake); a shallow clone has no tag to count from.
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: ${{ matrix.compiler }}
          qt: "true"
          nsis: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - uses: ./.github/actions/prepare-deps

      - name: Configure, build and install
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          set -euo pipefail
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET"
          cmake --install "build/$PRESET" --component runtime --prefix stage

      # vss_license issues licences, signs revocation lists and makes keys. It is the owner's tool: no archive,
      # installer or package may hold it, or a key file. The zip, the tar.gz and the Windows installer are made from
      # this staged tree, so checking it covers them.
      - name: Check that the staged tree holds no licence issuing tool and no key
        shell: bash
        run: python3 tools/ci/check_package_contents.py --source . --tree stage

      # Both programs run from the installed tree. The command line tool checks the wiring with no hardware. The GUI
      # needs a display to start, which a hosted Linux runner does not have, so there the check is that every library
      # it is linked to is found in the package.
      - name: Run the installed programs
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows)
              stage/bin/vss_cli.exe selftest
              stage/bin/vss_gui.exe --version
              # A console-subsystem GUI opens a console window beside it.
              python3 tools/check_pe_subsystem.py stage/bin/vss_gui.exe windows
              ;;
            macOS)
              stage/bin/vss_cli selftest
              stage/vss_gui.app/Contents/MacOS/vss_gui --version
              ;;
            *)
              stage/bin/vss_cli selftest
              if env -u LD_LIBRARY_PATH ldd stage/bin/vss_gui | grep "not found"; then
                echo "vss_gui needs a library the package does not hold" >&2
                exit 1
              fi
              ;;
          esac

      - name: Check the glibc the package needs
        if: runner.os == 'Linux'
        uses: iainchesworthlabs/icl-common-infra/actions/check-glibc-floor@ac3ee29b71f27ff63b1e0db61cb335764ed56940 # v0.1.23
        with:
          folder: stage
          # Boost.Asio's serial port code calls cfsetspeed, which glibc 2.42 (Ubuntu 26.04, the runner) versions anew.
          # The reason and the way out are in docs/releasing.md.
          allowed: "2.42"

      # The user-mode virtual COM port driver and its helper service go into the Windows packages, in bin\driver
      # beside the program, which is where Studio's "Set up Virtual Serial Studio" looks. They are built and signed
      # as the driver job of ci.yml builds and signs them, in the same SIGN_WINDOWS mode. The kernel-mode driver is
      # not shipped (docs/releasing.md says why).
      # No NuGet cache here: a workflow that publishes release artifacts must not restore a cache that a pull request
      # could have written (zizmor, cache-poisoning). The driver job of ci.yml caches; the release restores the
      # packages from NuGet each time.
      - name: Build and sign the user-mode driver
        if: runner.os == 'Windows'
        uses: ./.github/actions/build-windows-driver
        with:
          platform: x64
          mode: ${{ (github.event_name != 'pull_request' && vars.SIGN_WINDOWS) || 'false' }}
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}

      - name: Add the driver to the Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./drivers/windows/stage-package.ps1 -Out stage/bin/driver -Platform x64

      # Every first-party program and library in the package is signed, so a new one is
      # covered without a change here. The Qt DLLs and plugins are the Qt Company's and
      # ship as they were built. A dry run on a pull request never signs: the signing
      # secrets are for tagged, manual and scheduled runs only.
      - name: List the Windows binaries to sign
        id: binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem stage/bin -File | Where-Object { $_.Name -match '^vss_.*\.(exe|dll)$' } |
            ForEach-Object { 'stage/bin/' + $_.Name }
          if (-not ($files -contains 'stage/bin/vss_gui.exe' -and $files -contains 'stage/bin/vss_cli.exe')) {
            throw 'The package lacks vss_gui.exe or vss_cli.exe.'
          }
          "files<<EOF`n" + ($files -join "`n") + "`nEOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sign and verify the Windows binaries
        id: sign
        if: runner.os == 'Windows'
        uses: ./.github/actions/sign-windows-binaries
        with:
          mode: ${{ (github.event_name != 'pull_request' && vars.SIGN_WINDOWS) || 'false' }}
          files: ${{ steps.binaries.outputs.files }}
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}

      # Signs and notarises the staged app when the owner has set SIGN_MACOS=true and added the secrets
      # (docs/releasing.md). Without them it says the package is unsigned in the job summary and goes on.
      # Like the Windows step, a pull request never signs.
      - name: Sign the macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGN_MACOS: ${{ (github.event_name != 'pull_request' && vars.SIGN_MACOS) || 'false' }}
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          MACOS_SIGN_CERT_BASE64: ${{ secrets.MACOS_SIGN_CERT_BASE64 }}
          MACOS_SIGN_CERT_PASSWORD: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: tools/macos/ci-signing.sh stage/vss_gui.app stage/bin/vss_cli

      # The installer is made from the signed stage tree, so it holds the files that were just signed, and is then
      # signed itself. Its name carries the same -unsigned or -testsigned suffix as the zip.
      - name: Build the Windows installer
        id: installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          NAME: virtual-serial-studio-${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}-${{ matrix.name }}${{ steps.sign.outputs.suffix }}
        run: |
          set -euo pipefail
          # CPACK_INSTALLED_DIRECTORIES packages the stage tree; the empty CPACK_INSTALL_CMAKE_PROJECTS keeps CPack from
          # installing unsigned copies of the programs over it (cmake/packaging/VssPackage-windows.cmake).
          cpack --config "build/$PRESET/CPackConfig.cmake" -G NSIS -B dist \
            -D "CPACK_INSTALLED_DIRECTORIES=$(cygpath -m "$PWD/stage");/" \
            -D "CPACK_INSTALL_CMAKE_PROJECTS=" \
            -D "CPACK_PACKAGE_FILE_NAME=$NAME"
          rm -rf dist/_CPack_Packages
          test -f "dist/$NAME.exe"
          echo "path=dist/$NAME.exe" >> "$GITHUB_OUTPUT"

      - name: Sign and verify the Windows installer
        if: runner.os == 'Windows'
        uses: ./.github/actions/sign-windows-binaries
        with:
          mode: ${{ (github.event_name != 'pull_request' && vars.SIGN_WINDOWS) || 'false' }}
          files: ${{ steps.installer.outputs.path }}
          installer: "true"
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}

      # The runner is an administrator, so this is the real per-machine install. The first install leaves the driver
      # out (/DRIVER=0); the second is an upgrade over it, with the driver, which is the default. A hosted runner
      # trusts neither an unsigned nor a test-signed driver and the installer adds no certificate, so the expected
      # outcome there is "not-trusted": Studio installed, no driver, no service, and a log that says why. A driver
      # signed for a publisher the runner trusts would be installed, and then the service must be running.
      - name: Install the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 20
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
        run: ./tools/ci/check-windows-installer.ps1 -Phase Install -Installer $env:INSTALLER -SummaryFile $env:GITHUB_STEP_SUMMARY

      - name: Run the programs from the installed Windows folder
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          installed="$PROGRAMFILES/Virtual Serial Studio"
          "$installed/bin/vss_cli.exe" selftest
          "$installed/bin/vss_gui.exe" --version
          # The check for updates needs a TLS backend in the Qt that was installed (docs/updates.md, section 7.4).
          "$installed/bin/vss_gui.exe" --check-tls

      - name: Uninstall the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: ./tools/ci/check-windows-installer.ps1 -Phase Uninstall

      # A pull request does not sign, so the installer above holds unsigned driver files and setup-driver.ps1 refuses
      # them at the signature check, before it asks Windows anything. A signed run gets past that check, and once hung
      # in pnputil while every pull request run passed. setup-driver.ps1 now also refuses a catalog whose signer is
      # not in Trusted Publishers (exit 6) before it calls pnputil, so this rehearsal does not reach pnputil. It runs
      # that check on the runs that cannot sign: the driver files are signed in a copy with a throwaway certificate
      # nothing trusts, and the copy is installed, upgraded and uninstalled with the same check, which expects the
      # driver to be refused as not trusted. If the refusal came after pnputil again, the step would hang or end in
      # another driver state. On a runner with test signing off the files are refused at the signature check, as
      # in a pull request run.
      - name: Rehearse the signed path of the Windows installer
        if: runner.os == 'Windows' && steps.sign.outputs.mode == 'false'
        shell: pwsh
        timeout-minutes: 40
        env:
          PRESET: ${{ matrix.preset }}
        run: ./tools/ci/rehearse-signed-windows-installer.ps1 -Stage stage -CPackConfig "build/$env:PRESET/CPackConfig.cmake" -SummaryFile $env:GITHUB_STEP_SUMMARY

      - name: Archive
        shell: bash
        env:
          NAME: virtual-serial-studio-${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}-${{ matrix.name }}${{ steps.sign.outputs.suffix }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "dist/$NAME.zip" ./stage/*
          else
            tar -C stage -czf "dist/$NAME.tar.gz" .
          fi

      # The Linux installers come from the same build tree: CPack packs the runtime install component (docs/releasing.md).
      # The label after the hyphen in the tag becomes ~rc.1 in the deb version and 0.rc.1 in the rpm release. The
      # deb file name has a "." where the version has the "~", because GitHub would change it
      # (cmake/packaging/VssPackage-linux.cmake).
      - name: Build the deb and rpm
        if: runner.os == 'Linux'
        env:
          PRESET: ${{ matrix.preset }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          pre=""
          if [[ "$version" == *-* ]]; then pre="${version#*-}"; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm
          cmake -DVSS_PACKAGE=ON -DVSS_PACKAGE_PRERELEASE="$pre" "build/$PRESET"
          # CPack leaves its staging tree beside the packages, so it works outside dist/.
          cpack --config "build/$PRESET/CPackConfig.cmake" -B "$RUNNER_TEMP/cpack"
          cp "$RUNNER_TEMP"/cpack/*.deb "$RUNNER_TEMP"/cpack/*.rpm dist/
          # What the deb and the rpm hold, as each package itself lists it.
          dpkg-deb --contents dist/*.deb > "$RUNNER_TEMP/package-contents.txt"
          rpm -qpl dist/*.rpm >> "$RUNNER_TEMP/package-contents.txt"
          python3 tools/ci/check_package_contents.py --listing "$RUNNER_TEMP/package-contents.txt"

      # Each package is installed in a clean container of the system it is for, which runs what it installed and then removes it.
      - name: Install the deb and rpm in clean containers
        if: runner.os == 'Linux'
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: tools/ci/check_linux_packages.sh dist "$TAG"

      # The disk image is made by CPack's DragNDrop generator from the same runtime component as the archive
      # (cmake/packaging/VssPackage-darwin.cmake). CPack stages its own copy, so a signing identity in the environment
      # (set by the signing step above) makes cmake/packaging/VssPackage-darwin-sign.cmake sign that copy too.
      - name: Build the macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          NAME: virtual-serial-studio-${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}-${{ matrix.name }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cpack"
          cpack --config "build/$PRESET/CPackConfig.cmake" -G DragNDrop -B "$out"
          find "$out/_CPack_Packages" -maxdepth 4 | sort
          # The tree CPack staged is what the disk image holds.
          python3 tools/ci/check_package_contents.py --tree "$out/_CPack_Packages"
          shopt -s nullglob
          images=("$out"/*.dmg)
          test "${#images[@]}" -eq 1
          mkdir -p dist
          mv "${images[0]}" "dist/$NAME.dmg"
          ls -l dist

      # Mount the image the way a user would and run what it holds, so a layout or bundling mistake fails the build.
      - name: Run the programs from the disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          NAME: virtual-serial-studio-${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}-${{ matrix.name }}
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/vss-image"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "dist/$NAME.dmg"
          trap 'hdiutil detach "$mount" -force' EXIT
          ls -la "$mount"
          test -d "$mount/vss_gui.app"
          test "$(readlink "$mount/Applications")" = "/Applications"
          "$mount/bin/vss_cli" selftest
          "$mount/vss_gui.app/Contents/MacOS/vss_gui" --version
          # The check for updates needs a TLS backend in the bundle (docs/updates.md, section 7.4).
          "$mount/vss_gui.app/Contents/MacOS/vss_gui" --check-tls

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.package.result == 'success' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/release-publish.yml@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
    with:
      # The SBOM is made here, from third_party.json and the pinned versions, so it lists what the packages hold
      # (the shared workflow would scan the source tree). The pre-release script writes it before SHA512SUMS, so the
      # sums, the signatures and the attestations cover it. The verify script checks the names and the sums of the
      # files before the release is created (tools/ci/release_verify.py).
      generate-sbom: false
      pre-release-script: tools/ci/release_prepare.sh
      spdx-sbom: sbom.spdx.json
      verify-script: tools/ci/release_verify.sh
    secrets:
      REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
      REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  # The update feed (docs/updates.md, section 10): a small file that says which release is the newest, signed with the
  # owner's feed key and attached to the release as update-feed.json. The website build copies it to updates/v1/feed.json.
  # It signs only when this build trusts a feed key and the release environment holds the secret; otherwise it says so in
  # the summary and succeeds. Like publish it runs on a tag only, and only once publish has succeeded, so a pull request
  # (a branch ref) never starts it and never reaches the secret, which belongs to the release environment.
  feed:
    name: Publish the update feed
    needs: publish
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The secret is only tested for being empty, in this step's environment, and never printed.
      - name: Check that a feed can be signed
        id: keys
        env:
          UPDATE_FEED_PRIVATE_KEY: ${{ secrets.UPDATE_FEED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ids="$(python3 tools/update_feed.py keys --keys-from libs/vss_update/src/trusted_keys_release.cpp)"
          reason=""
          if [ -z "$ids" ]; then
            reason="this build of Studio trusts no update feed key"
          elif [ -z "$UPDATE_FEED_PRIVATE_KEY" ]; then
            reason="the secret UPDATE_FEED_PRIVATE_KEY is empty or missing in the release environment"
          fi
          if [ -n "$reason" ]; then
            echo "No update feed was signed: $reason." >> "$GITHUB_STEP_SUMMARY"
            echo "sign=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The first key in the file is the one that signs; the id comes from the repository, not from a secret.
          read -r key_id <<< "$ids"
          echo "sign=true" >> "$GITHUB_OUTPUT"
          echo "key_id=$key_id" >> "$GITHUB_OUTPUT"

      - name: Write the payload from the releases
        if: steps.keys.outputs.sign == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/feed"
          serial="$(python3 tools/update_feed.py collect --repo "$REPO" --out "$feed")"
          args=()
          if [ -d "$feed/stable" ]; then args+=(--stable "$feed/stable"); fi
          if [ -d "$feed/preview" ]; then args+=(--preview "$feed/preview"); fi
          python3 tools/update_feed.py payload --serial "$serial" --issued-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${args[@]}" --out "$feed/feed.payload.json"

      # The key file is made with no access for anyone else and is removed by the last step, whatever happens.
      - name: Sign the feed
        if: steps.keys.outputs.sign == 'true'
        env:
          UPDATE_FEED_PRIVATE_KEY: ${{ secrets.UPDATE_FEED_PRIVATE_KEY }}
          KEY_ID: ${{ steps.keys.outputs.key_id }}
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/feed"
          umask 077
          printf '%s\n' "$UPDATE_FEED_PRIVATE_KEY" > "$RUNNER_TEMP/update-feed.key"
          python3 tools/update_feed.py sign --key "$RUNNER_TEMP/update-feed.key" --key-id "$KEY_ID" \
            --payload "$feed/feed.payload.json" --out "$feed/update-feed.json"

      # With the public keys that Studio is built with, as the program will read the feed. A secret that is not the
      # private half of a trusted key stops the run here, before anything is attached to the release.
      - name: Verify the feed with the keys Studio trusts
        if: steps.keys.outputs.sign == 'true'
        run: |
          set -euo pipefail
          python3 tools/update_feed.py verify --keys-from libs/vss_update/src/trusted_keys_release.cpp \
            "$RUNNER_TEMP/feed/update-feed.json"

      - name: Attach the feed to the release
        if: steps.keys.outputs.sign == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUNNER_TEMP/feed/update-feed.json" --clobber
          echo "The update feed was signed and attached to $TAG as update-feed.json. Run the Docs workflow on main so that the website serves it." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/update-feed.key"
