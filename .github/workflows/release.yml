# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

# A tag v* pushed from develop builds the packages for each platform, signs the
# Windows ones as the SIGN_WINDOWS repository variable says, and hands them to the
# shared publish workflow, which checks the tag, signs, attests and publishes
# (docs/releasing.md). Without a tag the same packages are built and kept as workflow
# artifacts and nothing is published: by hand (`gh workflow run release.yml`), every
# Monday so the install rules cannot rot unseen, and on a pull request that changes
# this workflow.

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/release.yml"
      - "tools/check_release_version.py"
      - "drivers/windows/**"
      - "cmake/packaging/windows/**"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Check the version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with the project version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/check_release_version.py "$TAG"
      - name: Work out the version
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Check the release has notes
        uses: iainchesworthlabs/icl-common-infra/actions/release-notes@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          version: ${{ steps.tag.outputs.version }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          output-file: ${{ runner.temp }}/notes.md

  package:
    name: Package (${{ matrix.name }})
    needs: version
    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, runner: ubuntu-26.04, preset: linux-release-gui, compiler: gcc}
          - {name: macos-arm64, runner: macos-26, preset: macos-release-gui, compiler: none}
          - {name: windows-x86_64, runner: windows-2025, preset: windows-msvc-release-gui, compiler: msvc}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: ${{ matrix.compiler }}
          qt: "true"
          nsis: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - uses: ./.github/actions/prepare-deps

      - name: Configure, build and install
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          set -euo pipefail
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET"
          cmake --install "build/$PRESET" --component runtime --prefix stage

      # Both programs run from the installed tree. The command line tool checks the wiring with no hardware. The GUI
      # needs a display to start, which a hosted Linux runner does not have, so there the check is that every library
      # it is linked to is found in the package.
      - name: Run the installed programs
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows)
              stage/bin/vss_cli.exe selftest
              stage/bin/vss_gui.exe --version
              # A console-subsystem GUI opens a console window beside it.
              python3 tools/check_pe_subsystem.py stage/bin/vss_gui.exe windows
              ;;
            macOS)
              stage/bin/vss_cli selftest
              stage/vss_gui.app/Contents/MacOS/vss_gui --version
              ;;
            *)
              stage/bin/vss_cli selftest
              if env -u LD_LIBRARY_PATH ldd stage/bin/vss_gui | grep "not found"; then
                echo "vss_gui needs a library the package does not hold" >&2
                exit 1
              fi
              ;;
          esac

      - name: Check the glibc the package needs
        if: runner.os == 'Linux'
        uses: iainchesworthlabs/icl-common-infra/actions/check-glibc-floor@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          folder: stage
          # Boost.Asio's serial port code calls cfsetspeed, which glibc 2.42 (Ubuntu 26.04, the runner) versions anew.
          # The reason and the way out are in docs/releasing.md.
          allowed: "2.42"

      # The user-mode virtual COM port driver and its helper service go into the Windows packages, in bin\driver
      # beside the program, which is where Studio's "Set up Virtual Serial Studio" looks. They are built and signed
      # as the driver job of ci.yml builds and signs them, in the same SIGN_WINDOWS mode. The kernel-mode driver is
      # not shipped (docs/releasing.md says why).
      - name: Cache the NuGet packages
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.nuget\packages
          key: nuget-driver-${{ hashFiles('drivers/windows/vsscom/vsscom.vcxproj', 'drivers/windows/vsscom_um/vsscom_um.vcxproj', 'drivers/windows/vsscom_helper/vsscom_helper.vcxproj') }}

      - name: Build and sign the user-mode driver
        if: runner.os == 'Windows'
        uses: ./.github/actions/build-windows-driver
        with:
          platform: x64
          mode: ${{ (github.event_name != 'pull_request' && vars.SIGN_WINDOWS) || 'false' }}
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}

      - name: Add the driver to the Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./drivers/windows/stage-package.ps1 -Out stage/bin/driver -Platform x64

      # Every first-party program and library in the package is signed, so a new one is
      # covered without a change here. The Qt DLLs and plugins are the Qt Company's and
      # ship as they were built. A dry run on a pull request never signs: the signing
      # secrets are for tagged, manual and scheduled runs only.
      - name: List the Windows binaries to sign
        id: binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem stage/bin -File | Where-Object { $_.Name -match '^vss_.*\.(exe|dll)$' } |
            ForEach-Object { 'stage/bin/' + $_.Name }
          if (-not ($files -contains 'stage/bin/vss_gui.exe' -and $files -contains 'stage/bin/vss_cli.exe')) {
            throw 'The package lacks vss_gui.exe or vss_cli.exe.'
          }
          "files<<EOF`n" + ($files -join "`n") + "`nEOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sign and verify the Windows binaries
        id: sign
        if: runner.os == 'Windows'
        uses: ./.github/actions/sign-windows-binaries
        with:
          mode: ${{ (github.event_name != 'pull_request' && vars.SIGN_WINDOWS) || 'false' }}
          files: ${{ steps.binaries.outputs.files }}
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}

      # Signs and notarises the staged app when the owner has set SIGN_MACOS=true and added the secrets
      # (docs/releasing.md). Without them it says the package is unsigned in the job summary and goes on.
      # Like the Windows step, a pull request never signs.
      - name: Sign the macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGN_MACOS: ${{ (github.event_name != 'pull_request' && vars.SIGN_MACOS) || 'false' }}
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          MACOS_SIGN_CERT_BASE64: ${{ secrets.MACOS_SIGN_CERT_BASE64 }}
          MACOS_SIGN_CERT_PASSWORD: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: tools/macos/ci-signing.sh stage/vss_gui.app stage/bin/vss_cli

      # The installer is made from the signed stage tree, so it holds the files that were just signed, and is then
      # signed itself. Its name carries the same -unsigned or -testsigned suffix as the zip.
      - name: Build the Windows installer
        id: installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          NAME: virtual-serial-studio-${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}-${{ matrix.name }}${{ steps.sign.outputs.suffix }}
        run: |
          set -euo pipefail
          # CPACK_INSTALLED_DIRECTORIES packages the stage tree; the empty CPACK_INSTALL_CMAKE_PROJECTS keeps CPack from
          # installing unsigned copies of the programs over it (cmake/packaging/VssPackage-windows.cmake).
          cpack --config "build/$PRESET/CPackConfig.cmake" -G NSIS -B dist \
            -D "CPACK_INSTALLED_DIRECTORIES=$(cygpath -m "$PWD/stage");/" \
            -D "CPACK_INSTALL_CMAKE_PROJECTS=" \
            -D "CPACK_PACKAGE_FILE_NAME=$NAME"
          rm -rf dist/_CPack_Packages
          test -f "dist/$NAME.exe"
          echo "path=dist/$NAME.exe" >> "$GITHUB_OUTPUT"

      - name: Sign and verify the Windows installer
        if: runner.os == 'Windows'
        uses: ./.github/actions/sign-windows-binaries
        with:
          mode: ${{ (github.event_name != 'pull_request' && vars.SIGN_WINDOWS) || 'false' }}
          files: ${{ steps.installer.outputs.path }}
          installer: "true"
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}

      # The runner is an administrator, so this is the real per-machine install. The first install leaves the driver
      # out (/DRIVER=0); the second is an upgrade over it, with the driver, which is the default. A hosted runner
      # trusts neither an unsigned nor a test-signed driver and the installer adds no certificate, so the expected
      # outcome there is "not-trusted": Studio installed, no driver, no service, and a log that says why. A driver
      # signed for a publisher the runner trusts would be installed, and then the service must be running.
      - name: Install the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path $env:INSTALLER).Path
          $folder = Join-Path $env:ProgramFiles 'Virtual Serial Studio'
          # The installer is a 32-bit program, so its registry entries are in the 32-bit view.
          $key = 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\VirtualSerialStudio'
          function Get-DriverPackages {
            @(Get-WindowsDriver -Online -All | Where-Object { (Split-Path -Leaf $_.OriginalFileName) -eq 'vsscom_um.inf' })
          }
          function Assert-Studio([string] $when) {
            foreach ($file in 'bin\vss_gui.exe', 'bin\vss_cli.exe', 'bin\driver\setup-driver.ps1', 'bin\driver\driver\vsscom_um.cat', 'bin\driver\helper\vsscom_helper.exe', 'Uninstall.exe') {
              if (-not (Test-Path -LiteralPath (Join-Path $folder $file))) { throw "$file is missing after the $when." }
            }
            if (-not (Test-Path -LiteralPath $key)) { throw "No Apps & features entry after the $when." }
          }

          $p = Start-Process $installer -ArgumentList '/S', '/DRIVER=0' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode) (first install, /DRIVER=0)." }
          Assert-Studio 'first install'
          if ((Get-ItemProperty -LiteralPath $key).VssDriver -ne 'skipped') { throw 'The driver was not recorded as skipped after /DRIVER=0.' }
          if (Get-Service -Name vsscom_helper -ErrorAction SilentlyContinue) { throw '/DRIVER=0 installed the helper service.' }
          if ((Get-DriverPackages).Count -ne 0) { throw '/DRIVER=0 installed the driver.' }

          $p = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode) (upgrade)." }
          Assert-Studio 'upgrade'
          $state = (Get-ItemProperty -LiteralPath $key).VssDriver
          $log = Join-Path $folder 'driver-setup.log'
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log | ForEach-Object { Write-Host "driver-setup.log: $_" } }
          $service = Get-Service -Name vsscom_helper -ErrorAction SilentlyContinue
          switch ($state) {
            { $_ -in 'installed', 'installed-restart-needed' } {
              if (-not $service -or $service.Status -ne 'Running') { throw 'The driver is installed but the helper service is not running.' }
              if ((Get-DriverPackages).Count -ne 1) { throw 'The driver package is not in the driver store.' }
            }
            'not-trusted' {
              if ($service) { throw 'The driver was refused but a helper service exists.' }
              if ((Get-DriverPackages).Count -ne 0) { throw 'The driver was refused but a package is in the driver store.' }
              if ((Get-Content -LiteralPath $log -Raw) -notmatch 'not signed by a publisher this machine trusts') { throw 'driver-setup.log does not say why the driver was refused.' }
            }
            default { throw "Unexpected driver state '$state' after the upgrade." }
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value @('', '### Windows installer', '', "Silent install with the driver, on this runner: **$state**. A runner does not trust an unsigned or test-signed driver, so ``not-trusted`` (Studio installed, driver and service not) is the expected result here; the guest tests in docs/releasing.md cover the installed driver.")

          $shortcut = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Virtual Serial Studio\Virtual Serial Studio.lnk'
          if (-not (Test-Path -LiteralPath $shortcut)) { throw 'The Start menu shortcut is missing.' }
          # A silent install must not change the PATH.
          $path = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($path -like '*Virtual Serial Studio*') { throw 'A silent install added Studio to the PATH.' }

      - name: Run the programs from the installed Windows folder
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          installed="$PROGRAMFILES/Virtual Serial Studio"
          "$installed/bin/vss_cli.exe" selftest
          "$installed/bin/vss_gui.exe" --version

      - name: Uninstall the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:ProgramFiles 'Virtual Serial Studio'
          # The uninstaller copies itself to a temporary folder and returns at once, so wait for the folder to go.
          $p = Start-Process (Join-Path $folder 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The uninstaller exited with $($p.ExitCode)." }
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path -LiteralPath $folder) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path -LiteralPath $folder) {
            Get-ChildItem -LiteralPath $folder -Recurse | Select-Object -First 20 FullName | Out-String | Write-Host
            throw "$folder is still there after the uninstall."
          }
          if (Test-Path 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\VirtualSerialStudio') { throw 'The Apps & features entry is still there.' }
          if (Get-Service -Name vsscom_helper -ErrorAction SilentlyContinue) { throw 'The helper service is still there.' }
          if (@(Get-WindowsDriver -Online -All | Where-Object { (Split-Path -Leaf $_.OriginalFileName) -eq 'vsscom_um.inf' }).Count -ne 0) { throw 'The driver package is still in the driver store.' }
          if (Test-Path (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Virtual Serial Studio')) { throw 'The Start menu folder is still there.' }

      - name: Archive
        shell: bash
        env:
          NAME: virtual-serial-studio-${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}-${{ matrix.name }}${{ steps.sign.outputs.suffix }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "dist/$NAME.zip" ./stage/*
          else
            tar -C stage -czf "dist/$NAME.tar.gz" .
          fi

      # The disk image is made by CPack's DragNDrop generator from the same runtime component as the archive
      # (cmake/packaging/VssPackage-darwin.cmake). CPack stages its own copy, so a signing identity in the environment
      # (set by the signing step above) makes cmake/packaging/VssPackage-darwin-sign.cmake sign that copy too.
      - name: Build the macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          NAME: virtual-serial-studio-${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}-${{ matrix.name }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cpack"
          cpack --config "build/$PRESET/CPackConfig.cmake" -G DragNDrop -B "$out"
          find "$out/_CPack_Packages" -maxdepth 4 | sort
          shopt -s nullglob
          images=("$out"/*.dmg)
          test "${#images[@]}" -eq 1
          mkdir -p dist
          mv "${images[0]}" "dist/$NAME.dmg"
          ls -l dist

      # Mount the image the way a user would and run what it holds, so a layout or bundling mistake fails the build.
      - name: Run the programs from the disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          NAME: virtual-serial-studio-${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}-${{ matrix.name }}
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/vss-image"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "dist/$NAME.dmg"
          trap 'hdiutil detach "$mount" -force' EXIT
          ls -la "$mount"
          test -d "$mount/vss_gui.app"
          test "$(readlink "$mount/Applications")" = "/Applications"
          "$mount/bin/vss_cli" selftest
          "$mount/vss_gui.app/Contents/MacOS/vss_gui" --version

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.package.result == 'success' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/release-publish.yml@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
    secrets:
      REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
      REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
