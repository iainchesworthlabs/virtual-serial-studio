# SPDX-License-Identifier: GPL-3.0-or-later
name: Platform matrix

# The hosted-runner cells of the platform matrix (docs/platforms.md): the GUI build, the
# test suite, and the cell tests of tools/matrix/run_cell.py on each operating system and
# version. It runs every night, on request, and on a pull request that changes the matrix
# itself. It is not part of the pull request gate, which stays short (standard 11.2). The
# guest cells run on the owner's machine through tools/vm.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/platform-matrix.yml"
      - "tools/matrix/**"

permissions: {}

concurrency:
  group: platform-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cell:
    name: Cell ${{ matrix.cell }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cell: ubuntu-24.04,     os: ubuntu-24.04,     compiler: gcc,  preset: linux-release-gui }
          - { cell: ubuntu-26.04,     os: ubuntu-26.04,     compiler: gcc,  preset: linux-release-gui }
          - { cell: windows-2025,     os: windows-2025,     compiler: msvc, preset: windows-msvc-release-gui }
          - { cell: macos-15,         os: macos-15,         compiler: none, preset: macos-release-gui }
          - { cell: macos-26,         os: macos-26,         compiler: none, preset: macos-release-gui }
          - { cell: macos-15-intel,   os: macos-15-intel,   compiler: none, preset: macos-release-gui }
          - { cell: macos-26-intel,   os: macos-26-intel,   compiler: none, preset: macos-release-gui }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: ${{ matrix.compiler }}
          qt: "true"

      - uses: ./.github/actions/prepare-deps

      - name: Install GUI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Xvfb and the xcb libraries are what T9 needs to start the packaged GUI without a display.
          sudo apt-get install -y libgl1-mesa-dev xvfb xauth libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      # T1. A failure here does not stop the cell tests: they report what they find.
      - name: Build and run the suite
        id: suite
        continue-on-error: true
        uses: ./.github/actions/build-and-test
        with:
          preset: ${{ matrix.preset }}
          keep-going: "true"

      # T7 asks pyserial what it lists, so the probe needs it in the interpreter that runs the cell.
      - name: Install pyserial for the enumeration probe
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe/bin/pip" install --quiet pyserial==3.5

      # T9 runs the installed programs from an archive, the way the Release workflow packs them. If the
      # install fails there is no archive and T9 reports not_run.
      - name: Install and pack the runtime component
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          set -uo pipefail
          rm -rf "$RUNNER_TEMP/stage" "$RUNNER_TEMP/package.tar.gz"
          cmake --install "build/$PRESET" --component runtime --prefix "$RUNNER_TEMP/stage" &&
            (cd "$RUNNER_TEMP/stage" && cmake -E tar czf "$RUNNER_TEMP/package.tar.gz" .) || true

      - name: Run the cell tests
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CELL: ${{ matrix.cell }}
          PRESET: ${{ matrix.preset }}
          RUNNER_LABEL: ${{ matrix.os }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          PY=python
          command -v python3 >/dev/null 2>&1 && PY=python3
          [ -x "$RUNNER_TEMP/probe/bin/python" ] && PY="$RUNNER_TEMP/probe/bin/python"
          suite=1
          [ "$SUITE_OUTCOME" = success ] && suite=0
          "$PY" tools/matrix/run_cell.py --cell "$CELL" --build-dir "build/$PRESET" --out out \
            --commit "$COMMIT" --runner-label "$RUNNER_LABEL" --workflow-run "$RUN_ID" --t1-exit "$suite" \
            --package "$RUNNER_TEMP/package.tar.gz"

      - name: Keep the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.cell }}
          path: out
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Matrix result
    needs: cell
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results

      - name: Merge the results
        shell: bash
        run: |
          set -uo pipefail
          status=0
          python3 tools/matrix/merge_results.py results --check > table.md || status=$?
          { echo "## Platform matrix"; echo; cat table.md; } >> "$GITHUB_STEP_SUMMARY"
          cat table.md
          exit "$status"

      # A cell that runs out of time is cancelled and a cell that cannot set up fails; neither uploads
      # a result, so the cells that did would make the table look complete. The cell job's result says.
      - name: Check that every cell job succeeded
        if: ${{ !cancelled() && needs.cell.result != 'success' }}
        shell: bash
        env:
          CELL_RESULT: ${{ needs.cell.result }}
        run: |
          echo "::error::the cell jobs ended as $CELL_RESULT, so the result of a cell may be missing from the table"
          exit 1

      # failure() is false for a job that runs out of time, which GitHub cancels; cancelled() covers it.
      - name: Open the nightly issue
        if: ${{ (failure() || cancelled()) && github.event_name == 'schedule' }}
        uses: iainchesworthlabs/icl-common-infra/actions/report-nightly-failure@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          engine: Platform matrix
          detail: A hosted cell of the platform matrix failed a test or did not run one. The run summary has the table and the artifacts have the logs.
