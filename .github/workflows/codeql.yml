# SPDX-License-Identifier: GPL-3.0-or-later
name: CodeQL

# Code scanning, nightly on develop. There is no pull request trigger, so a finding never blocks a
# merge and a required check cannot be left waiting. The shared reusable workflow does not fetch
# Boost, so the C++ build is written out here. The C++ build includes the Qt GUI, which is most of
# the first-party code and would otherwise never be analysed. A failed analysis opens or updates
# one `nightly-analysis` issue.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-nightly-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      security-events: write
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build_mode: manual
          - language: python
            build_mode: none
          - language: actions
            build_mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Boost and the build tree live in the runner's temporary directory, outside the checkout.
      # CodeQL reports only on files under the checkout, so the Boost headers, the Qt generated
      # sources and the dependencies CMake fetches produce no alerts.
      - name: Choose directories outside the checkout
        if: matrix.build_mode == 'manual'
        run: |
          {
            echo "BOOST_ROOT=${RUNNER_TEMP}/boost-root"
            echo "VSS_BUILD_DIR=${RUNNER_TEMP}/build"
          } >> "$GITHUB_ENV"

      - name: Set up the toolchain
        if: matrix.build_mode == 'manual'
        uses: ./.github/actions/setup-toolchain
        with:
          compiler: gcc
          qt: "true"

      - name: Prepare dependencies
        if: matrix.build_mode == 'manual'
        uses: ./.github/actions/prepare-deps
        with:
          boost-dest: ${{ runner.temp }}/boost-root

      - name: Install GUI system libraries
        if: matrix.build_mode == 'manual'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - name: Initialise CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      - name: Build
        if: matrix.build_mode == 'manual'
        run: |
          set -euo pipefail
          cmake --preset linux-release-gui -B "$VSS_BUILD_DIR"
          cmake --build "$VSS_BUILD_DIR"

      - name: Analyze
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}

      - name: Report the failure
        if: failure() && github.ref == 'refs/heads/develop'
        uses: iainchesworthlabs/icl-common-infra/actions/report-nightly-failure@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          engine: CodeQL (${{ matrix.language }})
          detail: The CodeQL analysis failed to build or to complete. Open the run, fix the build or the finding, or dismiss the alert in Security > Code scanning with a justification.
