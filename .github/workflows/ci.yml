# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# The gate, in tiers (standard 11.2 and 11.5; docs/migration.md has the reasons). tools/ci/plan_legs.py
# decides which jobs a run needs, and the same answer goes to the "CI Status" aggregator.
#
#   draft pull request  the static jobs only
#   ready pull request  Linux GCC build and tests, ASan/UBSan, fuzz replay; TSan when threading code changed
#   merge-queue entry   the same on the merged tree, plus Windows MSVC, TSan, the Qt GUI build, the
#                       performance floors (library code changed), macOS (a change that can affect it)
#                       and the Windows driver (the driver changed)
#   push to develop     Linux Clang, macOS, coverage, Tracy profiling, the Windows driver; one run at a
#                       time with at most one waiting
#   workflow_dispatch   every job (gh workflow run ci.yml --ref <branch>)
#
# Required status checks are the two jobs defined here by name, "CI Status" and "Scan dependency
# diff": a check from a called workflow carries the caller's job name as a prefix, so it cannot be
# required by its plain name.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

# A new push to a pull request cancels the run it supersedes. Every push to develop shares one
# group and never cancels the run in progress: GitHub keeps one run going and one waiting, and a
# newer push replaces the waiting one, so a burst of merges is verified as one batch. Merge-queue
# entries each have their own ref and so build in parallel.
concurrency:
  group: ci-${{ github.event_name == 'push' && 'post-merge' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Policy
    permissions:
      contents: read
      pull-requests: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/policy.yml@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tier: ${{ steps.legs.outputs.tier }}
      build_matrix: ${{ steps.legs.outputs.build_matrix }}
      run_build: ${{ steps.legs.outputs.run_build }}
      run_macos: ${{ steps.legs.outputs.run_macos }}
      run_gui: ${{ steps.legs.outputs.run_gui }}
      run_coverage: ${{ steps.legs.outputs.run_coverage }}
      run_performance: ${{ steps.legs.outputs.run_performance }}
      run_profiling: ${{ steps.legs.outputs.run_profiling }}
      run_asan_ubsan: ${{ steps.legs.outputs.run_asan_ubsan }}
      run_fuzz_regress: ${{ steps.legs.outputs.run_fuzz_regress }}
      run_tsan: ${{ steps.legs.outputs.run_tsan }}
      run_driver: ${{ steps.legs.outputs.run_driver }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared scripts
        uses: iainchesworthlabs/icl-common-infra/actions/checkout-infra@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
      - name: Check the vendored CMake modules
        run: python3 tools/sync_cmake.py --infra .icl-infra --check
      - name: Decide scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "merge_group" ]; then
            git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed.txt"
            python3 .icl-infra/scripts/plan_gate.py --config .github/ci/plan.json < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/plan.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
            python3 .icl-infra/scripts/plan_gate.py --config .github/ci/plan.json --force-all > "$RUNNER_TEMP/plan.txt"
          fi
      # Which jobs this event needs: the tiers in the header. The driver build runs on a Windows
      # runner for each architecture, so it runs only when the driver or the gate itself changed.
      - name: Choose the legs
        id: legs
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          python3 tools/ci/plan_legs.py --event "$EVENT" --draft "${DRAFT:-false}" \
            --plan "$RUNNER_TEMP/plan.txt" --changed "$RUNNER_TEMP/changed.txt" \
            --config .github/ci/plan.json --summary "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"

  changelog:
    runs-on: ubuntu-latest
    name: Changelog fragments
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the changelog
        run: |
          python3 tools/changelog.py --check
          python3 -m unittest discover -s tools -p "test_*.py" -v
          python3 -m unittest discover -s tools/ci -p "test_*.py" -v

  design:
    name: Design tokens
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Check contrast
        run: python3 tools/check_contrast.py
      - name: Render the theme style sheets
        run: python3 tools/gen_qss.py --out "${RUNNER_TEMP}/qss"
      - name: Check the application icon files against the SVG
        run: |
          python3 -m pip install --quiet -r requirements/icon.txt
          python3 tools/gen_app_icon.py --check
          python3 -m unittest discover -s tools -p "test_gen_app_icon.py" -v

  build:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    name: Build and test (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.run_build == 'true'
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: ${{ matrix.compiler }}
          ccache: ${{ matrix.ccache }}
      - uses: ./.github/actions/prepare-deps
      - uses: ./.github/actions/build-and-test
        with:
          preset: ${{ matrix.preset }}

      - name: Save ccache
        if: always()
        uses: ./.github/actions/save-ccache

  macos:
    runs-on: macos-26
    name: Build and test (macos-appleclang)
    needs: plan
    if: needs.plan.outputs.run_macos == 'true'
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          ccache: macos-appleclang
      - uses: ./.github/actions/prepare-deps
      - uses: ./.github/actions/build-and-test
        with:
          preset: macos-release

      - name: Save ccache
        if: always()
        uses: ./.github/actions/save-ccache

  gui:
    runs-on: ubuntu-26.04
    name: Qt GUI (offscreen self-test)
    needs: plan
    if: needs.plan.outputs.run_gui == 'true'
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: gcc
          qt: "true"
          ccache: linux-gcc-gui

      - uses: ./.github/actions/prepare-deps

      - name: Install GUI system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - name: Configure
        run: cmake --preset linux-release-gui

      - name: Build
        run: cmake --build --preset linux-release-gui

      - name: GUI self-test
        run: QT_QPA_PLATFORM=offscreen ./build/linux-release-gui/bin/vss_gui --selftest

      # The UI journeys drive the real window with simulated mouse and key
      # events, offscreen, one test at a time (RUN_SERIAL). Every journey also
      # fails if the GUI thread is blocked for longer than its budget.
      - name: UI journeys
        run: ctest --preset linux-release-gui-ui

      - name: UI journey timings
        if: always()
        run: python3 tools/ci/ui_perf_summary.py build/linux-release-gui/ui-test-perf >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the window grabs of failed journeys
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-failures
          path: build/linux-release-gui/ui-test-failures
          if-no-files-found: ignore
          retention-days: 14

      - name: Save ccache
        if: always()
        uses: ./.github/actions/save-ccache

  coverage:
    runs-on: ubuntu-26.04
    name: Coverage (90% statements, 80% branches)
    needs: plan
    if: needs.plan.outputs.run_coverage == 'true'
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: clang
          ccache: linux-clang-coverage

      - uses: ./.github/actions/prepare-deps

      - name: Put the LLVM tools on the path
        run: |
          LLVM=$(python3 -c "import json; print(json.load(open('.github/toolchain-versions.json'))['llvm'])")
          echo "/usr/lib/llvm-$LLVM/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset linux-coverage

      - name: Build
        run: cmake --build --preset linux-coverage

      - name: Create a serial pair for the system tests
        shell: bash
        run: |
          : > pty.txt
          python3 tools/pty_loopback.py > pty.txt &
          for i in $(seq 1 100); do
            [ "$(wc -l < pty.txt)" -ge 2 ] && break
            sleep 0.2
          done
          A=$(sed -n 1p pty.txt)
          B=$(sed -n 2p pty.txt)
          [ -n "$A" ] && [ -n "$B" ] || { echo "no pty pair" >&2; exit 1; }
          echo "VSS_LOOPBACK_A=$A" >> "$GITHUB_ENV"
          echo "VSS_LOOPBACK_B=$B" >> "$GITHUB_ENV"
          echo "VSS_REQUIRE_LOOPBACK=1" >> "$GITHUB_ENV"

      - name: Run the suites with profiling
        run: |
          mkdir -p build/linux-coverage/profiles
          export LLVM_PROFILE_FILE="$PWD/build/linux-coverage/profiles/%p-%m.profraw"
          ./build/linux-coverage/bin/vss_unit_tests --junit=unit.xml
          ./build/linux-coverage/bin/vss_system_tests --junit=system.xml

      - name: Enforce the gates
        run: |
          python3 tools/coverage_report.py --build build/linux-coverage \
            --exclude libs/vss_testkit \
            --gate-exclude libs/vss_ports/src/vcom_driver.cpp \
            --min-lines 90 --min-branches 80 \
            --markdown coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save ccache
        if: always()
        uses: ./.github/actions/save-ccache

  coverage-gui:
    runs-on: ubuntu-26.04
    name: GUI coverage (ratchet toward 90% statements, 80% branches)
    needs: plan
    if: needs.plan.outputs.run_coverage == 'true'
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: clang
          qt: "true"
          ccache: linux-clang-coverage-gui

      - uses: ./.github/actions/prepare-deps

      - name: Install GUI system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - name: Put the LLVM tools on the path
        run: |
          LLVM=$(python3 -c "import json; print(json.load(open('.github/toolchain-versions.json'))['llvm'])")
          echo "/usr/lib/llvm-$LLVM/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset linux-coverage-gui

      - name: Build
        run: cmake --build --preset linux-coverage-gui

      # Every GUI test program, the UI suite among them, and the self-test run
      # instrumented. The UI journeys' stall budget is a performance check for
      # a release build and means nothing in an instrumented one, so it is
      # raised to a freeze detector here.
      - name: Run the GUI programs with profiling
        env:
          QT_QPA_PLATFORM: offscreen
          VSS_UI_BUDGET_MS: "60000"
        run: |
          mkdir -p build/linux-coverage-gui/profiles
          export LLVM_PROFILE_FILE="$PWD/build/linux-coverage-gui/profiles/%p-%m.profraw"
          for program in build/linux-coverage-gui/bin/vss_gui_*_tests; do
            "$program"
          done
          ./build/linux-coverage-gui/bin/vss_gui --selftest

      # The standard is 90% of statements and 80% of branches. The GUI measured
      # 83.5% and 68.9% (Windows, clang-cl, every GUI test program and the UI
      # suite) when this job was added, so the gate stands a little below that
      # and moves up as journeys are added; docs/testing.md lists the biggest
      # gaps. Raise it, never lower it.
      - name: Enforce the gates
        run: |
          python3 tools/coverage_report.py --build build/linux-coverage-gui \
            --objects build/linux-coverage-gui/bin/vss_gui \
            build/linux-coverage-gui/bin/vss_gui_*_tests \
            --include apps/vss_gui/ --exclude tests/ --exclude moc_ \
            --exclude mocs_compilation --exclude qrc_ \
            --min-lines 80 --min-branches 65 \
            --markdown coverage-gui.md
          cat coverage-gui.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save ccache
        if: always()
        uses: ./.github/actions/save-ccache

  performance:
    runs-on: ubuntu-26.04
    name: Performance floors
    needs: plan
    if: needs.plan.outputs.run_performance == 'true'
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: gcc
          ccache: linux-gcc-release

      - uses: ./.github/actions/prepare-deps

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release

      - name: Measure and gate
        run: |
          ./build/linux-release/bin/vss_perf --output=perf-results.json
          python3 tools/perf_report.py perf-results.json --floors perf/floors.json \
            --markdown | tee perf.md
          cat perf.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: |
            perf-results.json
            perf.md

      - name: Save ccache
        if: always()
        uses: ./.github/actions/save-ccache

  profiling:
    runs-on: ubuntu-26.04
    name: End-to-end profiling (Tracy)
    needs: plan
    if: needs.plan.outputs.run_profiling == 'true'
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
      TRACY_VERSION: v0.14.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: gcc
          qt: "true"
          ccache: linux-gcc-tracy

      - uses: ./.github/actions/prepare-deps

      - name: Install GUI system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      # Tracy's tools fetch CPM.cmake and their own sources from GitHub when they are
      # configured, and a refused download fails the job before any of this project builds.
      # The built tools are kept in the cache, so a run normally downloads nothing, and the
      # build is retried when it does have to download. Tracy builds for the CPU it runs on
      # unless NO_ISA_EXTENSIONS is set, and the runners differ, so the tools are built generic.
      - name: Restore the Tracy command line tools
        id: tracy-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tracy-tools
          key: tracy-tools-generic-${{ runner.os }}-${{ runner.arch }}-${{ env.TRACY_VERSION }}

      - name: Build the Tracy command line tools
        if: steps.tracy-tools.outputs.cache-hit != 'true'
        run: |
          source_dir="tracy-${TRACY_VERSION#v}"
          build_tools() {
            rm -rf tracy-src.tar.gz "$source_dir" tracy-tools &&
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 5               "https://github.com/wolfpld/tracy/archive/refs/tags/${TRACY_VERSION}.tar.gz"               -o tracy-src.tar.gz &&
            tar xzf tracy-src.tar.gz &&
            cmake -S "$source_dir/capture" -B tracy-tools/capture -DCMAKE_BUILD_TYPE=Release -DNO_ISA_EXTENSIONS=ON &&
            cmake --build tracy-tools/capture --parallel &&
            cmake -S "$source_dir/csvexport" -B tracy-tools/csvexport -DCMAKE_BUILD_TYPE=Release -DNO_ISA_EXTENSIONS=ON &&
            cmake --build tracy-tools/csvexport --parallel
          }
          for attempt in 1 2 3; do
            build_tools && exit 0
            echo "Building the Tracy tools failed (attempt $attempt of 3)." >&2
            sleep $((attempt * 20))
          done
          exit 1

      - name: Keep the Tracy command line tools
        if: steps.tracy-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tracy-tools
          key: ${{ steps.tracy-tools.outputs.cache-primary-key }}

      - name: Configure with instrumentation
        run: cmake --preset linux-tracy-gui

      - name: Build
        run: cmake --build --preset linux-tracy-gui --target vss_perf vss_gui vss_unit_tests --parallel

      # The instrumentation is compiled in but dormant here, as in a release build. This is its
      # cost per zone when nothing has asked for profiling, gated by perf/floors.json.
      - name: Dormant cost of a zone
        run: |
          ./build/linux-tracy-gui/bin/vss_perf --quick --output=perf-dormant.json
          python3 tools/perf_report.py perf-dormant.json --floors perf/floors.json \
            --only zone_dormant --markdown | tee perf-dormant.md
          { echo "### Dormant cost of a Tracy zone"; cat perf-dormant.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Create a serial pair for the terminal path
        run: |
          : > pty.txt
          python3 tools/pty_loopback.py > pty.txt &
          for i in $(seq 1 100); do
            [ "$(wc -l < pty.txt)" -ge 2 ] && break
            sleep 0.2
          done
          A=$(sed -n 1p pty.txt)
          B=$(sed -n 2p pty.txt)
          [ -n "$A" ] && [ -n "$B" ] || { echo "no pty pair" >&2; exit 1; }
          echo "VSS_LOOPBACK_A=$A" >> "$GITHUB_ENV"
          echo "VSS_LOOPBACK_B=$B" >> "$GITHUB_ENV"

      # Each workload is captured the same way: tracy-capture waits for the program to listen,
      # the program is started with --profile-wait so its first zone is recorded, and the trace
      # is exported and checked against the zones its profile in perf/required-zones.json names.
      - name: Capture the performance suite
        run: |
          ./tracy-tools/capture/tracy-capture -o tracy-perf.trace -a 127.0.0.1 -s 300 &
          CAP=$!
          ./build/linux-tracy-gui/bin/vss_perf --tracy --profile-wait=60 | tee perf-tracy.txt
          wait $CAP
          ./tracy-tools/csvexport/tracy-csvexport tracy-perf.trace > tracy-perf.csv
          {
            echo "### Tracy zones: performance suite"
            python3 tools/tracy_report.py tracy-perf.csv --profile perf --areas \
              --require perf.e2e.pty,perf.e2e.pty.chunk \
              --markdown tracy-perf.md --json tracy-perf.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Capture the GUI scenario
        run: |
          ./tracy-tools/capture/tracy-capture -o tracy-gui.trace -a 127.0.0.1 -s 600 &
          CAP=$!
          QT_QPA_PLATFORM=offscreen ./build/linux-tracy-gui/bin/vss_gui --selftest --profile --profile-wait=60
          wait $CAP
          ./tracy-tools/csvexport/tracy-csvexport tracy-gui.trace > tracy-gui.csv
          {
            echo "### Tracy zones: GUI self-test (offscreen)"
            python3 tools/tracy_report.py tracy-gui.csv --profile gui --areas \
              --markdown tracy-gui.md --json tracy-gui.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Capture the unit tests
        run: |
          ./tracy-tools/capture/tracy-capture -o tracy-tests.trace -a 127.0.0.1 -s 900 &
          CAP=$!
          ./build/linux-tracy-gui/bin/vss_unit_tests --tracy --profile-wait=60
          wait $CAP
          ./tracy-tools/csvexport/tracy-csvexport tracy-tests.trace > tracy-tests.csv
          {
            echo "### Tracy zones: unit tests (every test is a zone)"
            python3 tools/tracy_report.py tracy-tests.csv --profile tests --areas \
              --markdown tracy-tests.md --json tracy-tests.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tracy-profile
          path: |
            tracy-perf.trace
            tracy-perf.csv
            tracy-perf.md
            tracy-perf.json
            tracy-gui.trace
            tracy-gui.csv
            tracy-gui.md
            tracy-gui.json
            tracy-tests.trace
            tracy-tests.csv
            tracy-tests.md
            tracy-tests.json
            perf-tracy.txt
            perf-dormant.json

      - name: Save caches
        if: always()
        continue-on-error: true
        uses: iainchesworthlabs/icl-common-infra/actions/save-vcpkg-cache@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

      - name: Save ccache
        if: always()
        uses: ./.github/actions/save-ccache

  asan-ubsan:
    runs-on: ubuntu-26.04
    name: AddressSanitizer and UBSan
    needs: plan
    if: needs.plan.outputs.run_asan_ubsan == 'true'
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: clang
          qt: "true"
          ccache: linux-clang-asan

      - uses: ./.github/actions/prepare-deps

      - name: Install GUI system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - uses: ./.github/actions/build-and-test
        with:
          preset: linux-asan-ubsan-gui

  # Builds the libFuzzer targets and replays the seed corpus and the regression inputs under AddressSanitizer
  # and UBSan. The fuzz workflow does the fuzzing itself, on pushes to develop and at night.

      - name: Save ccache
        if: always()
        uses: ./.github/actions/save-ccache

  fuzz-regress:
    runs-on: ubuntu-26.04
    name: Fuzz regression replay
    needs: plan
    if: needs.plan.outputs.run_fuzz_regress == 'true'
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: clang
          ccache: linux-clang-fuzz

      - uses: ./.github/actions/prepare-deps

      - name: Configure
        run: cmake --preset linux-fuzz

      - name: Build
        run: cmake --build --preset linux-fuzz

      - name: Replay
        run: python3 tools/fuzz.py --mode regress

      - name: Test the runner
        run: python3 -m unittest discover -s tools -p "test_fuzz.py" -v

  # Threading findings come from timing: this leg runs on a pull request that changed threading code
  # and on every merge-queue entry.

      - name: Save ccache
        if: always()
        uses: ./.github/actions/save-ccache

  tsan:
    runs-on: ubuntu-26.04
    name: ThreadSanitizer
    needs: plan
    if: needs.plan.outputs.run_tsan == 'true'
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BOOST_ROOT: ${{ github.workspace }}/.cache/boost-root
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:ignore_noninstrumented_modules=1:suppressions=${{ github.workspace }}/tests/tsan.supp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          compiler: clang
          qt: "true"
          ccache: linux-clang-tsan

      - uses: ./.github/actions/prepare-deps

      - name: Install GUI system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - uses: ./.github/actions/build-and-test
        with:
          preset: linux-tsan-gui

      - name: Save ccache
        if: always()
        uses: ./.github/actions/save-ccache

  driver:
    name: Windows driver (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.run_driver == 'true'
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Windows SDK and the WDK are NuGet packages, about a gigabyte of them.
      - name: Cache the NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.nuget\packages
          key: nuget-driver-${{ hashFiles('drivers/windows/vsscom/vsscom.vcxproj', 'drivers/windows/vsscom_um/vsscom_um.vcxproj', 'drivers/windows/vsscom_helper/vsscom_helper.vcxproj') }}
      - name: Build, verify and package the kernel-mode driver
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: ./drivers/windows/build.ps1 -Platform $env:PLATFORM -Driver kmdf
      # The user-mode package and the helper service are built and signed by one action, which the Windows
      # leg of release.yml also uses, so a release holds the driver that CI tested. The package is built in two
      # stages with the signing between them, because its catalog holds the hash of the signed binary. The
      # SIGN_WINDOWS repository variable chooses: false leaves the files unsigned, test signs them with the
      # organisation's test certificate (docs/releasing.md). A pull request from a fork has no secrets and so
      # is never signed; when the secrets are not created yet the step says so and leaves the files unsigned.
      # Each signed file is then verified (.github/actions/sign-windows-binaries).
      - name: Build and sign the user-mode driver and the helper service
        id: um
        uses: ./.github/actions/build-windows-driver
        with:
          platform: ${{ matrix.platform }}
          mode: ${{ (github.event.pull_request.head.repo.fork != true && vars.SIGN_WINDOWS) || 'false' }}
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}
      - name: Upload the kernel-mode package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsscom-${{ matrix.platform }}
          path: drivers/windows/artifacts/package/${{ matrix.platform }}/
          if-no-files-found: error
      # Named for what it holds: -unsigned, or -testsigned, which a machine trusts only
      # with the owner's test CA installed (docs/test-signing.md in icl-common-infra).
      - name: Upload the user-mode package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsscom-um-${{ matrix.platform }}${{ steps.um.outputs.um-suffix }}
          path: drivers/windows/artifacts/package-um/${{ matrix.platform }}/
          if-no-files-found: error
      - name: Upload the helper service
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsscom-helper-${{ matrix.platform }}${{ steps.um.outputs.helper-suffix }}
          path: drivers/windows/artifacts/package-helper/${{ matrix.platform }}/
          if-no-files-found: error
      # The test client for the guests (drivers/windows/test/client32). The driver is x64 and
      # ARM64 only, so a 32-bit program meets it under WOW64 in an x64 guest: the x64 leg builds
      # the client as Win32 (the old programs' build) and as x64 (what it is compared with), the
      # ARM64 leg builds it for ARM64. Nothing runs against a driver here; a hosted runner cannot
      # load one. tools/vm/make-driver-bundle.ps1 packs these into a guest run.
      - name: Build the test client
        shell: pwsh
        env:
          ARCHITECTURES: ${{ matrix.platform == 'x64' && 'Win32 x64' || 'ARM64' }}
        run: |
          New-Item -ItemType Directory -Force client32-out | Out-Null
          foreach ($arch in $env:ARCHITECTURES -split ' ') {
            cmake -S drivers/windows/test/client32 -B "build/client32-$arch" -A $arch
            if ($LASTEXITCODE -ne 0) { throw "cmake failed for $arch" }
            cmake --build "build/client32-$arch" --config Release
            if ($LASTEXITCODE -ne 0) { throw "the test client did not build for $arch" }
            Copy-Item "build/client32-$arch/Release/vss_com_client_*.exe" client32-out
          }
          Get-ChildItem client32-out | Select-Object Name, Length
      # The 32-bit build must run here as a 32-bit program under WOW64. Nothing is opened but
      # COM1 and COM2, to see that the program starts and prints its JSON.
      - name: Check that the 32-bit client starts under WOW64
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $text = & ./client32-out/vss_com_client_x86.exe probe --first 1 --last 2 | Out-String
          $text
          $report = $text | ConvertFrom-Json
          if ($report.arch -ne 'x86' -or -not $report.wow64) { throw 'the 32-bit client did not run as a 32-bit program under WOW64' }
      - name: Upload the test client
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vss-com-client-${{ matrix.platform }}
          path: client32-out/
          if-no-files-found: error

  zizmor:
    name: Workflow analysis
    permissions:
      contents: read
      security-events: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/zizmor.yml@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

  dependency-scan:
    name: Scan dependency diff
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: iainchesworthlabs/icl-common-infra/actions/dependency-review@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19

  ci-status:
    name: CI Status
    if: always()
    needs: [policy, plan, changelog, design, build, macos, gui, coverage, coverage-gui, performance, profiling, asan-ubsan, fuzz-regress, tsan, driver, zizmor, dependency-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate
        uses: iainchesworthlabs/icl-common-infra/actions/ci-status@c412e6a542644c2316d21db351ef4218fa3e185d # v0.1.19
        with:
          needs: ${{ toJSON(needs) }}
          expected: >-
            {
              "build": ${{ needs.plan.outputs.run_build == 'true' }},
              "macos": ${{ needs.plan.outputs.run_macos == 'true' }},
              "gui": ${{ needs.plan.outputs.run_gui == 'true' }},
              "coverage": ${{ needs.plan.outputs.run_coverage == 'true' }},
              "coverage-gui": ${{ needs.plan.outputs.run_coverage == 'true' }},
              "performance": ${{ needs.plan.outputs.run_performance == 'true' }},
              "profiling": ${{ needs.plan.outputs.run_profiling == 'true' }},
              "asan-ubsan": ${{ needs.plan.outputs.run_asan_ubsan == 'true' }},
              "fuzz-regress": ${{ needs.plan.outputs.run_fuzz_regress == 'true' }},
              "tsan": ${{ needs.plan.outputs.run_tsan == 'true' }},
              "driver": ${{ needs.plan.outputs.run_driver == 'true' }},
              "dependency-scan": ${{ github.event_name != 'push' }}
            }
